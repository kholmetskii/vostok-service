services:
  db:
    image: postgres:16-alpine
    container_name: vostok_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vostok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vostok-local}
      POSTGRES_DB: ${POSTGRES_DB:-vostok}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vostok} -d ${POSTGRES_DB:-vostok}",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build:
      context: ./backend
    container_name: vostok_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vostok}:${POSTGRES_PASSWORD:-vostok-local}@db:5432/${POSTGRES_DB:-vostok}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: vostok_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
