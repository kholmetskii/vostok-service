server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Прокси для API: браузер будет ходить на http://<host>:8080/api/...
  # а nginx внутри docker-сети прокинет на backend:8000
  location /api/ {
    proxy_pass http://backend:8000/;

    # Полезные заголовки (часто нужны для логов/реальных IP/host)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA роутинг (React Router): любые несуществующие файлы -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}